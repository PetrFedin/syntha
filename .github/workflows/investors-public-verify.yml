name: investors public endpoint verify

on:
  push:
    branches: [agent/10-investor-product-page]
    paths:
      - '.github/workflows/investors-public-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify canonical production investors endpoint
        shell: bash
        run: |
          set -euo pipefail
          HOST='syntha-fashion-os.onrender.com'
          URL="https://${HOST}/investors"

          echo 'DNS:'
          getent ahostsv4 "$HOST" | head -n 3 || true

          curl --fail --silent --show-error --head \
            --connect-timeout 10 --max-time 45 "$URL" >/tmp/investors-head.txt
          grep -Fiq 'HTTP/' /tmp/investors-head.txt

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 45 \
            --dump-header /tmp/investors-headers.txt \
            -o /tmp/investors.html "$URL"

          grep -Fq 'От артикула до закрытия заказа' /tmp/investors.html
          grep -Fq 'https://syntha-fashion-os.onrender.com/investors' /tmp/investors.html
          grep -Fq 'QR-код публичной страницы Syntha' /tmp/investors.html
          grep -Fq 'href="/platform"' /tmp/investors.html
          grep -Fiq 'x-frame-options: DENY' /tmp/investors-headers.txt
          grep -Fiq "content-security-policy: default-src 'self'" /tmp/investors-headers.txt

          POST_STATUS=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            --output /tmp/post-body.txt \
            --dump-header /tmp/post-headers.txt \
            --write-out '%{http_code}' \
            --request POST "$URL")
          test "$POST_STATUS" = '405'

          echo "Verified canonical production host: $URL"
