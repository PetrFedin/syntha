name: investors visual QA

on:
  push:
    branches: [main]
    paths:
      - '_ai-share/synth-1-full/src/app/investors/**'
      - '_ai-share/synth-1-full/src/components/investors/**'
      - '_ai-share/synth-1-full/src/lib/investors/**'
      - '_ai-share/synth-1-full/scripts/investors-public-server.mjs'
      - '_ai-share/synth-1-full/public/investors-qr.svg'
      - '_ai-share/synth-1-full/e2e/investors-page.spec.ts'
      - '.github/workflows/investors-visual-qa.yml'
  pull_request:
    paths:
      - '_ai-share/synth-1-full/src/app/investors/**'
      - '_ai-share/synth-1-full/src/components/investors/**'
      - '_ai-share/synth-1-full/src/lib/investors/**'
      - '_ai-share/synth-1-full/scripts/investors-public-server.mjs'
      - '_ai-share/synth-1-full/public/investors-qr.svg'
      - '_ai-share/synth-1-full/e2e/investors-page.spec.ts'
      - '.github/workflows/investors-visual-qa.yml'
  workflow_dispatch:

concurrency:
  group: investors-visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  investors-visual-qa:
    name: Investor page E2E + screenshots
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_USE_B2C_SHOP_API: 'true'
      NEXT_PUBLIC_DISABLE_FONTS: '1'
      SYNTH_SKIP_ENTERPRISE_BOOTSTRAP: '1'
    defaults:
      run:
        working-directory: _ai-share/synth-1-full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: _ai-share/synth-1-full/package-lock.json
      - name: Smoke lightweight presentation server
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173 PUBLIC_INVESTORS_URL='https://syntha-fashion-os.onrender.com/investors' \
            node scripts/investors-public-server.mjs >/tmp/investors-public.log 2>&1 &
          PID=$!
          trap 'kill "$PID" >/dev/null 2>&1 || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/health >/tmp/investors-health.json; then
              break
            fi
            sleep 0.25
          done
          grep -Fq '"ok":true' /tmp/investors-health.json
          grep -Fq '"qrReady":true' /tmp/investors-health.json
          curl --fail --silent --dump-header /tmp/investors-headers.txt \
            http://127.0.0.1:4173/investors >/tmp/investors-public.html
          grep -Fq 'От артикула до закрытия заказа' /tmp/investors-public.html
          grep -Fq 'https://syntha-fashion-os.onrender.com/investors' /tmp/investors-public.html
          grep -Fq 'QR-код публичной страницы Syntha' /tmp/investors-public.html
          grep -Fiq 'x-frame-options: DENY' /tmp/investors-headers.txt
          grep -Fiq "content-security-policy: default-src 'self'" /tmp/investors-headers.txt
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run investor page browser QA
        run: npx playwright test e2e/investors-page.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investors-visual-qa
          path: |
            _ai-share/synth-1-full/test-results/investors-desktop.png
            _ai-share/synth-1-full/test-results/investors-mobile.png
            _ai-share/synth-1-full/playwright-report/
          if-no-files-found: warn
          retention-days: 7
