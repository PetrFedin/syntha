name: security next maintenance upgrade

on:
  push:
    branches: [agent/13-runtime-dependency-audit]
    paths:
      - '.github/workflows/security-next-upgrade.yml'

permissions:
  contents: write

jobs:
  update-next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _ai-share/synth-1-full
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/13-runtime-dependency-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - name: Update Next.js to latest 15.x maintenance backport
        env:
          HUSKY: '0'
        run: npm install next@15.5.25 --save --package-lock-only --ignore-scripts
      - name: Confirm critical/high Next findings are cleared
        shell: bash
        run: |
          node -e "const p=require('./package.json'); console.log('package.json next=',p.dependencies.next)"
          set +e
          npm audit --omit=dev --json > /tmp/runtime-audit-after-next.json
          STATUS=$?
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/runtime-audit-after-next.json','utf8'));
          console.log('runtime audit after Next update:', JSON.stringify(data.metadata?.vulnerabilities ?? {}));
          const next=data.vulnerabilities?.next;
          if (next) {
            console.log('Next remains in npm audit:', next.severity, next.range);
            if (next.severity === 'critical' || next.severity === 'high') {
              process.exit(1);
            }
          }
          NODE
          echo "npm_audit_exit_after_next=$STATUS" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit package and lockfile update
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _ai-share/synth-1-full/package.json _ai-share/synth-1-full/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency diff to commit'
            exit 0
          fi
          git commit -m "fix(security): upgrade Next.js to 15.5.25"
          git push origin HEAD:agent/13-runtime-dependency-audit
