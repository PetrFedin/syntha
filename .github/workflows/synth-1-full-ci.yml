# TEMPORARY BRANCH-ONLY formatter capture. Revert after the canonical files are committed.
name: synth-1-full CI

on:
  push:
    paths:
      - '_ai-share/synth-1-full/**'
      - '.github/workflows/synth-1-full-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - '_ai-share/synth-1-full/**'
      - '.github/workflows/synth-1-full-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: _ai-share/synth-1-full

jobs:
  format-investor-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/10-investor-product-page
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: _ai-share/synth-1-full/package-lock.json
      - run: npm ci
      - name: Apply repository Prettier + Tailwind formatting
        run: npx prettier --write src/components/investors/InvestorBriefPageClient.tsx src/components/layout/client-layout.tsx
      - name: Commit formatted files when changed
        run: |
          if git diff --quiet -- src/components/investors/InvestorBriefPageClient.tsx src/components/layout/client-layout.tsx; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/investors/InvestorBriefPageClient.tsx src/components/layout/client-layout.tsx
          git commit -m "style(investors): apply canonical Prettier formatting"
          git push origin HEAD:agent/10-investor-product-page
