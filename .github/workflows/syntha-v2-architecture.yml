name: Syntha V2 Architecture

on:
  pull_request:
    paths:
      - 'apps/syntha-wholesale-v2/**'
      - '.github/workflows/syntha-v2-architecture.yml'
  push:
    branches: [main]
    paths:
      - 'apps/syntha-wholesale-v2/**'
      - '.github/workflows/syntha-v2-architecture.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate architecture and documentation
        working-directory: apps/syntha-wholesale-v2
        run: npm run verify
