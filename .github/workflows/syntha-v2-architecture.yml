name: Syntha V2 Foundation

on:
  pull_request:
    paths:
      - 'apps/syntha-wholesale-v2/**'
      - '.github/workflows/syntha-v2-architecture.yml'
  push:
    branches: [main]
    paths:
      - 'apps/syntha-wholesale-v2/**'
      - '.github/workflows/syntha-v2-architecture.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/syntha-wholesale-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/syntha-wholesale-v2/package-lock.json
      - name: Install V2 package from lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate V2 governance and architecture
        run: npm run preflight
      - name: Typecheck V2
        run: npm run typecheck
      - name: Lint V2
        run: npm run lint
      - name: Run V2 unit tests
        run: npm run test
      - name: Build V2 production runtime
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run V2 browser smoke test
        run: npm run test:e2e
