name: Syntha V2 Foundation

on:
  pull_request:
    paths:
      - 'apps/syntha-wholesale-v2/**'
      - '.github/workflows/syntha-v2-architecture.yml'
  push:
    branches: [main]
    paths:
      - 'apps/syntha-wholesale-v2/**'
      - '.github/workflows/syntha-v2-architecture.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install V2 package
        working-directory: apps/syntha-wholesale-v2
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Verify V2 runtime and foundation
        working-directory: apps/syntha-wholesale-v2
        run: npm run verify
      - name: Install Playwright Chromium
        working-directory: apps/syntha-wholesale-v2
        run: npx playwright install --with-deps chromium
      - name: Run V2 browser smoke test
        working-directory: apps/syntha-wholesale-v2
        run: npm run test:e2e
